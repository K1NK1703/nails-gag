[versions]
springBoot = "4.1.1"
springModulith = "2.1.1"
archunit = "1.5.1"
# Инструментация OTel: 2.28.x собрана под OpenTelemetry 1.62, как в BOM Spring Boot 4.1.1
opentelemetryInstrumentation = "2.28.1-alpha"
palantirJavaFormat = "2.100.0"
spotless = "8.10.3"
foojay = "1.0.0"
# Лимиты частоты API; не входит в BOM Spring Boot
bucket4j = "8.21.0"
# Схема OpenAPI и Swagger UI только при локальном запуске; 3.x — для Spring Boot 4, не входит в BOM
springdoc = "3.1.1"
# span-ы SQL в трассах; 2.x собрана под Spring Boot 4.1, не входит в BOM
datasourceMicrometer = "2.3.0"

[libraries]
# BOM-ы: версии всего остального из Spring Boot и Spring Modulith
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
# RestClient для обмена кода на профиль у Яндекс ID и VK ID
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
# Иерархия исключений доступа к данным (PessimisticLockingFailureException) для HTTP-слоя без JPA
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
# Boot не связывает Logback с SdkLoggerProvider сам; логи в OTLP уходят через этот appender
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetryInstrumentation" }
# span-ы SQL: DataSource оборачивается прокси, каждый запрос — наблюдение Micrometer, вложенное в span запроса
datasource-micrometer = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot", version.ref = "datasourceMicrometer" }
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# @AutoConfigureTracing: в тестах Boot экспорт трасс выключен, аннотация включает его (версия из BOM Spring Boot)
spring-boot-micrometer-tracing-test = { module = "org.springframework.boot:spring-boot-micrometer-tracing-test" }
# InMemorySpanExporter и InMemoryLogRecordExporter для проверки трасс и логов в тестах (версия из BOM Spring Boot)
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
# RestTestClient и @AutoConfigureRestTestClient для HTTP-тестов модуля api
spring-boot-resttestclient = { module = "org.springframework.boot:spring-boot-resttestclient" }
# Лимиты частоты API: корзины Bucket4j в памяти, устаревание ключей — Caffeine (версия из BOM Spring Boot)
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
# OpenAPI и Swagger UI для bootRun (developmentOnly в app): в app.jar и образ не попадает
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Только для компиляции настройки схемы в api (SpringDocUtils, ParameterCustomizer); в рабочий classpath не попадает
springdoc-common = { module = "org.springdoc:springdoc-openapi-starter-common", version.ref = "springdoc" }

spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }

postgresql = { module = "org.postgresql:postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# плагин Spotless как библиотека для build-logic
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
