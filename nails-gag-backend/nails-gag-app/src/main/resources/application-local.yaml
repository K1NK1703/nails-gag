# Профиль local: читаемые логи вместо JSON, Compose поднимает базу сам, вход — через подставного провайдера.
spring:
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only

logging:
  structured:
    format:
      console:

nails-gag:
  files:
    # bootRun работает из корня проекта бэкенда: файлы — в nails-gag-backend/build/files.
    root: build/files
  identity:
    fake-provider:
      enabled: true
  # Разовый перенос фото в портфолио (gag.nails.app.portfolio.PortfolioImport): путь к списку в JSON, относительный —
  # от каталога запуска (bootRun — корень проекта бэкенда). Пусто — импорт не запускается.
  portfolio-import:
    source: ""
  api:
    # Vite отдаёт сайт на 5173 и проксирует /api на 8080.
    site-origin: http://localhost:5173
    cookies:
      secure: false

# springdoc есть только при bootRun (developmentOnly): схема OpenAPI для фронта и Swagger UI.
springdoc:
  # Только адреса сайта: без /error и служебных.
  paths-to-match: /api/**
  # Тип успешных ответов в схеме — JSON, а не */*: по нему генератор типов фронта находит тело ответа.
  default-produces-media-type: application/json
  api-docs:
    # По умолчанию у springdoc 3; настройка схемы в api (null в полях — массив типов) рассчитана только на 3.1.
    version: openapi_3_1
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs
