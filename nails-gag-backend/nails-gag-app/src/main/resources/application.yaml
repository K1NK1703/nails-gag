spring:
  application:
    name: nails-gag
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Схему ведёт Liquibase; Hibernate только сверяет сущности с ней.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/master.yaml

nails-gag:
  time-zone: Europe/Moscow
  files:
    # Корень хранилища фото; в Docker — том. Создаётся при первой загрузке.
    root: /var/lib/nails-gag/files
    # 15 МБ: фронт ужимает фото до 2000 px, а сервер всё равно проверяет сам.
    max-file-bytes: 15728640
    max-pixels: 50000000
    # Обработка картинки занимает память и процессор: одновременно не больше этого числа, остальные ждут.
    max-concurrent-processing: 2
    # Сколько загрузка ждёт места обработки, прежде чем ответить 503 files.busy.
    processing-wait: 10s
  identity:
    # Пары provider:subject, которым при входе выдаётся роль «Разработчик»: ["YANDEX:1234567", "VK:7654321"]
    bootstrap-developers: []
    jobs:
      enabled: true
    fake-provider:
      enabled: false
    # Пустой client-id — провайдер выключен. Секреты задавать через переменные окружения, не в файле.
    providers:
      yandex:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
      vk:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
  api:
    # Origin сайта: с ним сверяется Origin изменяющих запросов (CSRF), от него строятся переходы после входа.
    # Абсолютный, без пути и завершающего слэша; https (http — только для localhost).
    site-origin: https://nails-gag.ru
    cookies:
      # Атрибут Secure у cookie слоя; false только в профиле local, иначе браузер не сохранит их на http://localhost.
      secure: true
    # Ключ шифрования cookie этапа входа: base64, ровно 32 байта. В prod обязателен; вне prod пустой ключ
    # заменяется случайным при старте. Задавать через переменную окружения, не в файле.
    login-state-key: ""
    # Лимиты частоты запросов в минуту: вход (/api/auth/**) и анонимные — по IP, с сессией — по аккаунту.
    rate-limits:
      auth-per-minute: 10
      anonymous-per-minute: 60
      authenticated-per-minute: 600
    # Пути на сайте, куда обратный вызов провайдера отправляет браузер.
    redirects:
      signed-in: /cabinet
      registration: /register
      link-confirm: /cabinet/account?link=confirm
      linked: /cabinet/account?link=done
      # К пути добавляется ?error=failed|blocked|provider.
      failure: /login

server:
  # IP и схема клиента из X-Forwarded-* — только от прокси из частных сетей (RemoteIpValve Tomcat).
  forward-headers-strategy: native

management:
  server:
    # Actuator на отдельном порту, который прокси наружу не публикует.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        # Иначе OtlpMeterRegistry шлёт метрики на localhost:4318 по умолчанию; включает профиль observability.
        enabled: false

jdbc:
  # span-ы SQL (datasource-micrometer): только выполнение запросов, без получения соединений и чтения строк.
  includes: QUERY
  datasource-proxy:
    # Значения параметров в span-ы не пишутся: там телефоны и другие данные людей. Текст запроса — с плейсхолдерами.
    # false — и так умолчание библиотеки; задано явно, чтобы смена умолчания в новой версии не открыла данные.
    include-parameter-values: false

logging:
  structured:
    format:
      console: ecs
