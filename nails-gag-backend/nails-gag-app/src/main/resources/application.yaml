spring:
  application:
    name: nails-gag
  threads:
    virtual:
      enabled: true
  task:
    execution:
      # Общий applicationTaskExecutor создаётся, хотя у слушателей уведомлений свой пул (notificationsListenerExecutor,
      # 4 потока): без force Spring Boot не создаёт общий при наличии другого Executor, и прочие @Async ушли бы на пул
      # уведомлений.
      mode: force
      # При остановке приложения начатые задачи общего исполнителя дорабатывают, но не дольше периода.
      shutdown:
        await-termination: true
        await-termination-period: 20s
  mail:
    # Почтовый сервер писем уведомлений: host, port, username, password — при развёртывании через переменные окружения
    # (SPRING_MAIL_HOST и т. д.), не в файле. Без host (или без nails-gag.notifications.email.from) почта выключена.
    properties:
      # Таймауты SMTP, мс. Обязательны и не больше 20 с (проверяются при старте): отправка держит доставку в аренде
      # 5 минут от начала попытки, а письмо — около десятка обменов с сервером; без таймаутов JavaMail ждёт сервер
      # бесконечно. Для SMTPS (spring.mail.protocol: smtps) — те же ключи mail.smtps.*.
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 20000
      "[mail.smtp.writetimeout]": 20000
  jpa:
    open-in-view: false
    hibernate:
      # Схему ведёт Liquibase; Hibernate только сверяет сущности с ней.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/master.yaml
  modulith:
    events:
      # Реестр публикаций событий: таблица в своей схеме, её ведёт Liquibase модуля уведомлений, а не Spring Modulith.
      jdbc:
        schema: modulith
        schema-initialization:
          enabled: false
      # Событие, не обработанное слушателем до остановки или падения, обрабатывается снова после старта.
      republish-outstanding-events-on-restart: true
      # Завершённые публикации удаляются сразу: в таблице только необработанные.
      completion-mode: delete
  servlet:
    multipart:
      # Загрузка фото (POST /api/files): файл — ровно max-file-bytes модуля файлов, запрос — больше, с запасом на
      # заголовки формы (оба сверяются при старте). Больше — 413 files.too_large_file.
      max-file-size: 15MB
      max-request-size: 16MB
      # Тело разбирается только адресом загрузки, после проверки сессии, прав и Content-Length.
      resolve-lazily: true

nails-gag:
  time-zone: Europe/Moscow
  booking:
    # Сколько дней хранятся фото-референсы после визита или отмены записи: политика конфиденциальности обещает 30.
    reference-retention-days: 30
    jobs:
      enabled: true
      # Ночное удаление референсов с истёкшим сроком, по времени салона; отмена и истечение идут раз в минуту.
      reference-cleanup-cron: "0 0 4 * * *"
  files:
    # Корень хранилища фото; в Docker — том. Создаётся при первой загрузке.
    root: /var/lib/nails-gag/files
    # 15 МБ: фронт ужимает фото до 2000 px, а сервер всё равно проверяет сам.
    max-file-bytes: 15728640
    max-pixels: 50000000
    # Обработка картинки занимает память и процессор: одновременно не больше этого числа, остальные ждут.
    max-concurrent-processing: 2
    # Сколько загрузка ждёт места обработки, прежде чем ответить 503 files.busy.
    processing-wait: 10s
    jobs:
      enabled: true
      # Ночная уборка по времени салона: «сироты» старше суток и каталоги на диске без строки в базе.
      cleanup-cron: "0 30 3 * * *"
  finance:
    jobs:
      enabled: true
      # Записи повторяющихся шаблонов за наступивший день, по времени салона: сразу после смены дня.
      recurring-cron: "0 15 0 * * *"
  analytics:
    # Домен сайта: переход с него (с www. или без) считается источником direct, а не внешним сайтом.
    site-host: nails-gag.ru
    # Пределы max-keys-per-metric, max-visitors-per-day и max-concurrent-writes — по умолчанию из AnalyticsProperties.
    jobs:
      enabled: true
      # Уборка солей и отпечатков прошедших дней, по времени салона: вскоре после смены дня.
      purge-cron: "0 30 0 * * *"
  identity:
    # Пары provider:subject, которым при входе выдаётся роль «Разработчик»: ["YANDEX:1234567", "VK:7654321"]
    bootstrap-developers: []
    jobs:
      enabled: true
    fake-provider:
      enabled: false
    # Пустой client-id — провайдер выключен. Секреты задавать через переменные окружения, не в файле.
    providers:
      yandex:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
      vk:
        client-id: ""
        client-secret: ""
        redirect-uri: ""
  notifications:
    jobs:
      enabled: true
      # Пауза между прогонами отправки созревших сообщений.
      dispatch-delay: 1m
      # Ночная уборка по времени салона: сообщения в конечном состоянии старше retention-days и истёкшие ссылки.
      purge-cron: "0 15 4 * * *"
    retention-days: 90
    # Тихие часы клиенток по времени салона: сообщение переносится на их конец, напоминание накануне в них не ставится.
    quiet-hours: { from: "22:00", to: "09:00" }
    # Адрес сайта для ссылок в сообщениях (кабинет, запись в админке); без пути и завершающего слэша. Свой ключ модуля,
    # по умолчанию — origin сайта слоя api: в профиле local ссылки писем ведут на локальный сайт.
    site-url: ${nails-gag.api.site-origin}
    master-telegram: "@gagushichewa"
    salon-address: "пр. КИМа 6, метро Приморская, 3 этаж, студия 365"
    email:
      # Отправитель писем. Пустой вместе с spring.mail.host — почта выключена.
      from: "nails.gag <noreply@nails-gag.ru>"
    telegram:
      # Токен бота от @BotFather — секрет, задавать через переменную окружения, не в файле. Пустой — Telegram выключен.
      bot-token: ""
      # Имя бота без @ для ссылки привязки t.me/<бот>; обязательно при токене.
      bot-username: ""
      # Сколько Telegram держит запрос getUpdates без новых сообщений.
      poll-timeout: 50s
  api:
    # Origin сайта: с ним сверяется Origin изменяющих запросов (CSRF), от него строятся переходы после входа.
    # Абсолютный, без пути и завершающего слэша; https (http — только для localhost).
    site-origin: https://nails-gag.ru
    cookies:
      # Атрибут Secure у cookie слоя; false только в профиле local, иначе браузер не сохранит их на http://localhost.
      secure: true
    # Ключ шифрования cookie этапа входа: base64, ровно 32 байта. В prod обязателен; вне prod пустой ключ
    # заменяется случайным при старте. Задавать через переменную окружения, не в файле.
    login-state-key: ""
    # Лимиты частоты запросов (в минуту, загрузки — в час): вход (/api/auth/**), анонимные, картинки и события
    # счётчика — по IP (IPv6 — по сети /64), с сессией и загрузки — по аккаунту.
    rate-limits:
      auth-per-minute: 10
      anonymous-per-minute: 60
      authenticated-per-minute: 600
      # Загрузки фото (POST /api/files) одного аккаунта в час, вдобавок к общей корзине аккаунта.
      uploads-per-hour: 30
      # Чтение картинок портфолио (GET/HEAD /api/portfolio/images/**) с одного IP в минуту — своя корзина вместо
      # общей: лендинг запрашивает их десятками.
      images-per-minute: 600
      # События счётчика посещений (POST /api/analytics/events) с одного IP в минуту — своя корзина вместо общей и
      # корзины аккаунта: события летят с каждой страницы сайта.
      analytics-per-minute: 120
    # Пути на сайте, куда обратный вызов провайдера отправляет браузер.
    redirects:
      signed-in: /cabinet
      registration: /register
      link-confirm: /cabinet/account?link=confirm
      linked: /cabinet/account?link=done
      # К пути добавляется ?error=failed|blocked|provider.
      failure: /login

server:
  # IP и схема клиента из X-Forwarded-* — только от прокси из частных сетей (RemoteIpValve Tomcat).
  forward-headers-strategy: native

management:
  server:
    # Actuator на отдельном порту, который прокси наружу не публикует.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Недоступный почтовый сервер — не болезнь приложения: письма повторяются по расписанию, сбой виден в логе. Иначе
      # каждая проверка здоровья ходила бы на почтовый сервер.
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        # Иначе OtlpMeterRegistry шлёт метрики на localhost:4318 по умолчанию; включает профиль observability.
        enabled: false

jdbc:
  # span-ы SQL (datasource-micrometer): только выполнение запросов, без получения соединений и чтения строк.
  includes: QUERY
  datasource-proxy:
    # Значения параметров в span-ы не пишутся: там телефоны и другие данные людей. Текст запроса — с плейсхолдерами.
    # false — и так умолчание библиотеки; задано явно, чтобы смена умолчания в новой версии не открыла данные.
    include-parameter-values: false

logging:
  structured:
    format:
      console: ecs
  level:
    # Hibernate пишет WARN с текстом драйвера на каждый сбой SQL — в обход ограничения частоты в логе приёма событий
    # счётчика и с сообщением, где бывают значения. Класс исключения и SQLState и так пишут ProblemHandler и модули.
    org.hibernate.orm.jdbc.error: error
