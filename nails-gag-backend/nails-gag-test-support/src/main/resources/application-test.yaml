spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/test-master.yaml
nails-gag:
  time-zone: Europe/Moscow
  booking:
    jobs:
      # Планировщик записей в тестах не работает: тесты вызывают BookingMaintenance сами.
      enabled: false
  files:
    # Запасной каталог для запуска тестов мимо Gradle (из IDE). Gradle задаёт свой каталог каждой задаче тестов —
    # build/test-files/<задача> модуля (системное свойство сильнее этого файла) и очищает его перед прогоном.
    root: ${java.io.tmpdir}/nails-gag-files-test
    jobs:
      # Уборка хранилища в тестах не работает: тесты вызывают FileMaintenance сами.
      enabled: false
  identity:
    jobs:
      # Обслуживание входа в тестах не работает: тесты вызывают IdentityMaintenance сами.
      enabled: false
    fake-provider:
      # Единственный способ пройти вход в тестах без сети.
      enabled: true
logging:
  level:
    liquibase: warn
